[package]
name = "pi-agent-desktop"
version = "0.1.0"
description = "Pi Agent Desktop — Tauri 2 + Vue 3 + Node sidecar with OS keychain for API keys"
authors = ["Pi Agent"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
# Tauri 2 core
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
# v0.5.7: tauri-plugin-shell for `app.shell().sidecar("pi-agent-sidecar")` 走 Tauri 2 标准
#   sidecar 机制 (之前 v0.5.6 commit 115959e 漏了这个, 直接用 `Command::new(&script)` 写死
#   编译时绝对路径 `D:\UnityWork\Tools\Pi\sidecar\dist\pi-agent-sidecar.exe`, 干净机器找不到)
tauri-plugin-shell = "2"
# Logging
log = "0.4"
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Async runtime for sidecar process I/O
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "process", "sync"] }
# OS keychain (Windows Credential Manager / macOS Keychain / Linux Secret Service)
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }
# Error handling
thiserror = "1"
# Time for log timestamps
chrono = "0.4"
# HTTP client (sync, simple, no async SSL cert chain)
ureq = { version = "2", features = ["json"] }
# v0.4.4.4 Skill 导入: 解析 zip 压缩包 (Tauri 2 标准 zip crate, 支持 .md + 多文件 skill pack)
zip = { version = "2", default-features = false, features = ["deflate"] }

# ADR-0020 P-Sec1 (2026-08-23): 沙箱加固 — Windows Job Object 资源限制
#   - Win32_System_JobObjects: CreateJobObjectW / SetInformationJobObject / AssignProcessToJobObject
#   - Win32_System_Threading: OpenProcess (用 pid 拿进程 handle)
#   - Win32_Foundation: HANDLE / CloseHandle
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_Foundation",
    "Win32_Security",  # CreateJobObjectW 签名里 SECURITY_ATTRIBUTES 需要
] }
