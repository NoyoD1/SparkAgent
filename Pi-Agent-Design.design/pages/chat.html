<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pi-Agent-Design v2 - 聊天</title>
  <link rel="stylesheet" href="../colors_and_type.css" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root {
      font-family: var(--pad-font-sans);
    }
    * { box-sizing: border-box; }
    html, body, #app { height: 100%; overflow: hidden; }
    body {
      background: var(--pad-background);
      color: var(--pad-foreground);
      font-size: var(--pad-fs-14);
      line-height: var(--pad-lh-base);
      -webkit-font-smoothing: antialiased;
    }
    #app {
      background: var(--pad-bg-active);
      padding: var(--pad-sp-2);
      gap: var(--pad-sp-2);
    }
    .pad-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
    .pad-scroll::-webkit-scrollbar-thumb { background: var(--pad-border-strong); border-radius: 3px; }
    .pad-scroll::-webkit-scrollbar-track { background: transparent; }
    .workspace-chevron { transition: transform var(--pad-dur-base) var(--pad-ease-in-out); }
    .workspace-chevron.collapsed { transform: rotate(-90deg); }
    .chevron { transition: transform var(--pad-dur-base) var(--pad-ease-in-out); }
    .chevron.collapsed { transform: rotate(-90deg); }
    .thinking-body {
      display: grid;
      grid-template-rows: 1fr;
      transition: grid-template-rows var(--pad-dur-base) var(--pad-ease-out-soft);
    }
    .thinking-body.collapsed { grid-template-rows: 0fr; }
    .thinking-body > div { overflow: hidden; }
    .drawer {
      transition: width var(--pad-dur-base) var(--pad-ease-out-soft), opacity var(--pad-dur-base) var(--pad-ease-out-soft);
    }
    .drawer.collapsed { width: 0; opacity: 0; overflow: hidden; }
    .sidebar {
      transition: width var(--pad-dur-base) var(--pad-ease-out-soft), opacity var(--pad-dur-base) var(--pad-ease-out-soft);
    }
    .sidebar.collapsed { width: 0; opacity: 0; overflow: hidden; }
    .icon-btn {
      display: inline-flex; align-items: center; justify-content: center;
      width: 28px; height: 28px; border-radius: var(--pad-radius-md);
      color: var(--pad-fg-secondary); cursor: pointer;
      transition: background var(--pad-dur-fast), color var(--pad-dur-fast);
    }
    .icon-btn:hover { background: var(--pad-bg-hover); color: var(--pad-fg-primary); }
    .lucide { width: 16px; height: 16px; stroke-width: 1.75; }
  </style>
</head>
<body>
  <div id="app" class="flex flex-col">
    <!-- 顶部标题栏 -->
    <header class="h-[36px] flex items-center justify-between px-3 rounded-[var(--pad-radius-xl)] bg-[var(--pad-bg-app)] shrink-0 select-none">
      <div class="flex items-center gap-1 text-[var(--pad-fg-secondary)]">
        <button class="icon-btn"><i data-lucide="search" class="lucide"></i></button>
        <button class="h-7 px-2 text-[13px] rounded-[var(--pad-radius-md)] hover:bg-[var(--pad-bg-hover)] hover:text-[var(--pad-fg-primary)] transition-colors">编辑(E)</button>
        <button class="h-7 px-2 text-[13px] rounded-[var(--pad-radius-md)] hover:bg-[var(--pad-bg-hover)] hover:text-[var(--pad-fg-primary)] transition-colors">帮助(H)</button>
      </div>
      <div class="flex items-center gap-1">
        <button id="toggleSidebar" class="icon-btn" title="切换侧栏"><i data-lucide="panel-left" class="lucide"></i></button>
        <button id="toggleDrawer" class="icon-btn" title="切换任务摘要抽屉"><i data-lucide="panel-right" class="lucide"></i></button>
        <button class="icon-btn"><i data-lucide="minus" class="lucide"></i></button>
        <button class="icon-btn"><i data-lucide="square" class="lucide"></i></button>
        <button class="icon-btn hover:text-[var(--pad-danger)]"><i data-lucide="x" class="lucide"></i></button>
      </div>
    </header>

    <!-- 主体区域 -->
    <main class="flex-1 flex overflow-hidden" style="gap:var(--pad-sp-2);">
      <!-- 左侧边栏 -->
      <aside id="sidebar" class="sidebar w-[248px] bg-[var(--pad-bg-sidebar)] rounded-[var(--pad-radius-xl)] flex flex-col shrink-0">
        <!-- 标签 -->
        <div class="flex items-center gap-1 px-3 pt-3 pb-2">
          <button class="px-2 h-7 text-[13px] font-medium rounded-[var(--pad-radius-md)] bg-[var(--pad-bg-active)] text-[var(--pad-fg-primary)]">Work</button>
          <button class="px-2 h-7 text-[13px] font-medium rounded-[var(--pad-radius-md)] text-[var(--pad-fg-secondary)] hover:bg-[var(--pad-bg-hover)] hover:text-[var(--pad-fg-primary)] transition-colors">Code</button>
          <button class="px-2 h-7 text-[13px] font-medium rounded-[var(--pad-radius-md)] text-[var(--pad-fg-secondary)] hover:bg-[var(--pad-bg-hover)] hover:text-[var(--pad-fg-primary)] transition-colors">Design</button>
        </div>

        <!-- 新建任务 -->
        <div class="px-3 pb-2">
          <button class="w-full h-8 flex items-center gap-2 px-3 rounded-[var(--pad-radius-md)] text-[13px] text-[var(--pad-fg-secondary)] hover:bg-[var(--pad-bg-hover)] hover:text-[var(--pad-fg-primary)] transition-colors">
            <i data-lucide="plus" class="lucide"></i>
            <span>新建任务</span>
          </button>
        </div>

        <!-- 功能列表 -->
        <nav class="px-2 pb-2">
          <button class="w-full h-8 flex items-center gap-2 px-3 rounded-[var(--pad-radius-md)] text-[13px] text-[var(--pad-fg-secondary)] hover:bg-[var(--pad-bg-hover)] hover:text-[var(--pad-fg-primary)] transition-colors">
            <i data-lucide="plug" class="lucide"></i>
            <span>插件市场</span>
          </button>
          <button class="w-full h-8 flex items-center gap-2 px-3 rounded-[var(--pad-radius-md)] text-[13px] text-[var(--pad-fg-secondary)] hover:bg-[var(--pad-bg-hover)] hover:text-[var(--pad-fg-primary)] transition-colors">
            <i data-lucide="zap" class="lucide"></i>
            <span>自动化</span>
          </button>
          <button class="w-full h-8 flex items-center gap-2 px-3 rounded-[var(--pad-radius-md)] text-[13px] text-[var(--pad-fg-secondary)] hover:bg-[var(--pad-bg-hover)] hover:text-[var(--pad-fg-primary)] transition-colors">
            <i data-lucide="briefcase" class="lucide"></i>
            <span>办公助理</span>
          </button>
          <button class="w-full h-8 flex items-center gap-2 px-3 rounded-[var(--pad-radius-md)] text-[13px] text-[var(--pad-fg-secondary)] hover:bg-[var(--pad-bg-hover)] hover:text-[var(--pad-fg-primary)] transition-colors">
            <i data-lucide="layout-template" class="lucide"></i>
            <span>模板库</span>
          </button>
        </nav>

        <!-- 任务列表 -->
        <div class="px-4 pt-3 pb-2 flex items-center justify-between text-[12px] text-[var(--pad-fg-tertiary)]">
          <span>任务列表</span>
          <div class="flex items-center gap-1">
            <button class="icon-btn w-5 h-5"><i data-lucide="plus" class="lucide"></i></button>
            <button class="icon-btn w-5 h-5"><i data-lucide="list" class="lucide"></i></button>
          </div>
        </div>

        <!-- 工作区与会话 -->
        <div class="flex-1 overflow-y-auto pad-scroll px-2 pb-2">
          <!-- NX_Photovoltaic 展开 -->
          <div class="mb-1">
            <button class="workspace-toggle w-full h-7 flex items-center gap-1 px-1 rounded-[var(--pad-radius-md)] text-[13px] text-[var(--pad-fg-secondary)] hover:bg-[var(--pad-bg-hover)] hover:text-[var(--pad-fg-primary)] transition-colors">
              <i data-lucide="chevron-down" class="lucide workspace-chevron"></i>
              <span class="truncate">NX_Photovoltaic</span>
            </button>
            <div class="workspace-content pl-5 mt-0.5 space-y-0.5">
              <button class="w-full h-8 flex items-center justify-between px-2 rounded-[var(--pad-radius-md)] text-[13px] bg-[var(--pad-bg-active)] text-[var(--pad-fg-primary)]">
                <span class="truncate">你好</span>
                <i data-lucide="list" class="lucide text-[var(--pad-fg-tertiary)]"></i>
              </button>
              <button class="w-full h-8 flex items-center px-2 rounded-[var(--pad-radius-md)] text-[13px] text-[var(--pad-fg-secondary)] hover:bg-[var(--pad-bg-hover)] hover:text-[var(--pad-fg-primary)] transition-colors truncate">
                光伏采集数据接入与前端展示
              </button>
            </div>
          </div>

          <!-- 其他折叠工作区 -->
          <div class="space-y-0.5">
            <button class="workspace-toggle w-full h-7 flex items-center gap-1 px-1 rounded-[var(--pad-radius-md)] text-[13px] text-[var(--pad-fg-secondary)] hover:bg-[var(--pad-bg-hover)] hover:text-[var(--pad-fg-primary)] transition-colors">
              <i data-lucide="chevron-down" class="lucide workspace-chevron collapsed"></i>
              <span class="truncate">QA</span>
            </button>
            <button class="workspace-toggle w-full h-7 flex items-center gap-1 px-1 rounded-[var(--pad-radius-md)] text-[13px] text-[var(--pad-fg-secondary)] hover:bg-[var(--pad-bg-hover)] hover:text-[var(--pad-fg-primary)] transition-colors">
              <i data-lucide="chevron-down" class="lucide workspace-chevron collapsed"></i>
              <span class="truncate">EditTools</span>
            </button>
            <button class="workspace-toggle w-full h-7 flex items-center gap-1 px-1 rounded-[var(--pad-radius-md)] text-[13px] text-[var(--pad-fg-secondary)] hover:bg-[var(--pad-bg-hover)] hover:text-[var(--pad-fg-primary)] transition-colors">
              <i data-lucide="chevron-down" class="lucide workspace-chevron collapsed"></i>
              <span class="truncate">Energy</span>
            </button>
            <button class="workspace-toggle w-full h-7 flex items-center gap-1 px-1 rounded-[var(--pad-radius-md)] text-[13px] text-[var(--pad-fg-secondary)] hover:bg-[var(--pad-bg-hover)] hover:text-[var(--pad-fg-primary)] transition-colors">
              <i data-lucide="chevron-down" class="lucide workspace-chevron collapsed"></i>
              <span class="truncate">PostalParkProject_new</span>
            </button>
          </div>
        </div>

        <!-- 底部用户区 -->
        <div class="h-12 px-3 flex items-center gap-2 shrink-0">
          <div class="w-6 h-6 rounded-[var(--pad-radius-md)] bg-[var(--pad-accent)] flex items-center justify-center text-white text-[10px] font-semibold">N</div>
          <div class="flex-1 min-w-0">
            <div class="text-[13px] text-[var(--pad-fg-primary)] truncate">燎原</div>
            <div class="text-[11px] text-[var(--pad-fg-tertiary)] truncate">免费</div>
          </div>
          <button class="icon-btn"><i data-lucide="message-square" class="lucide"></i></button>
        </div>
      </aside>

      <!-- 中间主聊天区 -->
      <section class="flex-1 flex flex-col bg-[var(--pad-card)] rounded-[var(--pad-radius-xl)] min-w-0 overflow-hidden">
        <!-- 聊天 header -->
        <div class="h-12 px-4 flex items-center justify-between shrink-0">
          <div class="flex items-center gap-2 min-w-0">
            <span class="text-[15px] font-semibold text-[var(--pad-fg-primary)] truncate">你好</span>
            <span class="text-[12px] text-[var(--pad-fg-tertiary)] shrink-0">07月29日 17:38</span>
            <button class="icon-btn w-6 h-6"><i data-lucide="more-horizontal" class="lucide"></i></button>
          </div>
          <div class="flex items-center gap-1 shrink-0">
            <button id="openInDropdown" class="h-8 px-2 flex items-center gap-1.5 rounded-[var(--pad-radius-md)] text-[13px] text-[var(--pad-fg-secondary)] hover:bg-[var(--pad-bg-hover)] hover:text-[var(--pad-fg-primary)] transition-colors">
              <i data-lucide="code-2" class="lucide"></i>
              <span>在</span>
              <span class="font-medium text-[var(--pad-fg-primary)]">中打开</span>
              <i data-lucide="chevron-down" class="lucide chevron"></i>
            </button>
            <button class="icon-btn"><i data-lucide="bell" class="lucide"></i></button>
          </div>
        </div>

        <!-- 下拉菜单（文件视图切换） -->
        <div id="dropdownMenu" class="hidden absolute right-[calc(var(--drawer-width,340px)+12px)] top-[48px] bg-[var(--pad-bg-elevated)] border border-[var(--pad-border)] rounded-[var(--pad-radius-lg)] shadow-[var(--pad-shadow-popover)] py-1 z-50 min-w-[160px]">
          <button class="w-full h-8 px-3 text-left text-[13px] text-[var(--pad-fg-secondary)] hover:bg-[var(--pad-bg-hover)] hover:text-[var(--pad-fg-primary)] flex items-center gap-2">
            <i data-lucide="code-2" class="lucide"></i> 在编辑器中打开
          </button>
          <button class="w-full h-8 px-3 text-left text-[13px] text-[var(--pad-fg-secondary)] hover:bg-[var(--pad-bg-hover)] hover:text-[var(--pad-fg-primary)] flex items-center gap-2">
            <i data-lucide="folder" class="lucide"></i> 在文件夹中打开
          </button>
          <button class="w-full h-8 px-3 text-left text-[13px] text-[var(--pad-fg-secondary)] hover:bg-[var(--pad-bg-hover)] hover:text-[var(--pad-fg-primary)] flex items-center gap-2">
            <i data-lucide="external-link" class="lucide"></i> 在浏览器中打开
          </button>
        </div>

        <!-- 聊天消息区 -->
        <div class="flex-1 overflow-y-auto pad-scroll p-4 space-y-4">
          <!-- 用户消息 -->
          <div class="flex justify-end">
            <div class="max-w-[70%] bg-[var(--pad-bg-hover)] text-[var(--pad-fg-primary)] px-4 py-2.5 rounded-[var(--pad-radius-xl)] rounded-tr-[var(--pad-radius-sm)] text-[14px]">
              你好
            </div>
          </div>

          <!-- AI 消息 -->
          <div class="flex justify-start">
            <div class="max-w-[80%] bg-[var(--pad-card)] rounded-[var(--pad-radius-xl)] rounded-tl-[var(--pad-radius-sm)] p-4 shadow-[var(--pad-shadow-button)]">
              <div class="flex items-center gap-2 mb-2">
                <div class="w-6 h-6 rounded-[var(--pad-radius-md)] bg-[var(--pad-accent)] flex items-center justify-center text-white">
                  <i data-lucide="bot" class="lucide"></i>
                </div>
                <span class="text-[13px] font-semibold text-[var(--pad-fg-primary)]">TraeWork</span>
              </div>

              <!-- 思考过程 -->
              <div class="mb-3">
                <button class="thinking-toggle flex items-center gap-1 text-[12px] text-[var(--pad-fg-tertiary)] hover:text-[var(--pad-fg-secondary)] transition-colors">
                  <span>思考过程</span>
                  <i data-lucide="chevron-down" class="lucide chevron"></i>
                </button>
                <div class="thinking-body">
                  <div>
                    <div class="mt-2 text-[13px] text-[var(--pad-fg-secondary)] leading-relaxed bg-[var(--pad-bg-active)] rounded-[var(--pad-radius-lg)] p-3">
                      用户发送了问候，我需要友好回应并询问可以提供哪些帮助。
                    </div>
                  </div>
                </div>
              </div>

              <!-- 正文 -->
              <div class="text-[14px] text-[var(--pad-fg-primary)] leading-relaxed mb-3">
                你好！我是你的全栈开发搭档，有什么可以帮你的吗？
              </div>

              <!-- 操作栏 -->
              <div class="flex items-center justify-between">
                <div class="flex items-center gap-1">
                  <button class="icon-btn"><i data-lucide="thumbs-up" class="lucide"></i></button>
                  <button class="icon-btn"><i data-lucide="thumbs-down" class="lucide"></i></button>
                  <button class="icon-btn"><i data-lucide="copy" class="lucide"></i></button>
                  <button class="icon-btn"><i data-lucide="refresh-cw" class="lucide"></i></button>
                </div>
                <span class="text-[11px] text-[var(--pad-fg-tertiary)]">由 AI 生成</span>
              </div>
            </div>
          </div>
        </div>

        <!-- 底部 composer -->
        <div class="p-4 shrink-0">
          <div class="bg-[var(--pad-bg-input)] rounded-[var(--pad-radius-xl)] px-3 py-2">
            <textarea
              class="w-full bg-transparent text-[14px] text-[var(--pad-fg-primary)] placeholder:text-[var(--pad-fg-tertiary)] resize-none outline-none"
              rows="2"
              placeholder="帮你编写代码、调试 Bug、优化性能等开发工作，交付生产级代码产物。"
            ></textarea>
            <div class="flex items-center justify-between mt-2">
              <div class="flex items-center gap-1">
                <button class="icon-btn"><i data-lucide="plus" class="lucide"></i></button>
                <button class="icon-btn"><i data-lucide="image" class="lucide"></i></button>
                <button class="icon-btn"><i data-lucide="paperclip" class="lucide"></i></button>
              </div>
              <div class="flex items-center gap-1">
                <button class="h-8 px-2 flex items-center gap-1 rounded-[var(--pad-radius-md)] text-[13px] text-[var(--pad-fg-secondary)] hover:bg-[var(--pad-bg-hover)] transition-colors">
                  <span>Kimi-K2.7-Code</span>
                  <i data-lucide="chevron-down" class="lucide"></i>
                </button>
                <button class="icon-btn"><i data-lucide="mic" class="lucide"></i></button>
                <button class="w-8 h-8 flex items-center justify-center rounded-[var(--pad-radius-md)] bg-[var(--pad-primary)] text-white hover:bg-[var(--pad-accent-hover)] transition-colors shadow-[var(--pad-shadow-button)]">
                  <i data-lucide="arrow-up" class="lucide"></i>
                </button>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- 右侧任务摘要抽屉 -->
      <aside id="drawer" class="drawer w-[340px] bg-[var(--pad-bg-sidebar)] rounded-[var(--pad-radius-xl)] flex flex-col shrink-0">
        <!-- 抽屉 header -->
        <div class="h-12 px-4 flex items-center justify-between shrink-0">
          <span class="text-[15px] font-semibold text-[var(--pad-fg-primary)]">任务摘要</span>
          <div class="flex items-center gap-1">
            <button class="icon-btn"><i data-lucide="plus" class="lucide"></i></button>
            <button id="collapseDrawer" class="icon-btn" title="收起抽屉"><i data-lucide="panel-right-close" class="lucide"></i></button>
          </div>
        </div>

        <div class="flex-1 overflow-y-auto pad-scroll px-3 pb-3" style="gap:var(--pad-sp-2);">
          <!-- 待办 section -->
          <div class="bg-[var(--pad-bg-active)] rounded-[var(--pad-radius-xl)] overflow-hidden">
            <button class="section-toggle w-full h-10 px-4 flex items-center justify-between text-[13px] font-medium text-[var(--pad-fg-primary)] hover:bg-[var(--pad-bg-hover)] transition-colors">
              <span>待办</span>
              <i data-lucide="chevron-down" class="lucide chevron"></i>
            </button>
            <div class="section-body">
              <div class="px-4 pb-5 pt-1 flex flex-col items-center text-center">
                <div class="w-10 h-10 rounded-full bg-[var(--pad-bg-hover)] flex items-center justify-center mb-2">
                  <i data-lucide="list-checks" class="lucide text-[var(--pad-fg-tertiary)]"></i>
                </div>
                <div class="text-[13px] text-[var(--pad-fg-secondary)] tracking-widest">暂 无 待 办</div>
                <div class="text-[12px] text-[var(--pad-fg-tertiary)] mt-1">复杂任务的进展会显示在这里</div>
              </div>
            </div>
          </div>

          <!-- 上下文 section -->
          <div class="bg-[var(--pad-bg-active)] rounded-[var(--pad-radius-xl)] overflow-hidden mt-2">
            <button class="section-toggle w-full h-10 px-4 flex items-center justify-between text-[13px] font-medium text-[var(--pad-fg-primary)] hover:bg-[var(--pad-bg-hover)] transition-colors">
              <div class="flex items-center gap-2">
                <span>上下文</span>
                <i data-lucide="info" class="lucide text-[var(--pad-fg-tertiary)]"></i>
              </div>
              <i data-lucide="chevron-down" class="lucide chevron"></i>
            </button>
            <div class="section-body">
              <div class="px-4 pb-5 pt-1">
                <div class="flex items-center justify-between mb-2">
                  <div class="flex-1 h-1.5 bg-[var(--pad-bg-hover)] rounded-full overflow-hidden mr-3">
                    <div class="h-full w-[13%] bg-[var(--pad-warning)] rounded-full"></div>
                  </div>
                  <button class="h-6 px-2 text-[12px] rounded-[var(--pad-radius-md)] bg-[var(--pad-bg-hover)] text-[var(--pad-fg-secondary)] hover:bg-[var(--pad-bg-hover)] transition-colors">压缩</button>
                </div>
                <div class="flex flex-col items-center text-center mt-5">
                  <div class="w-10 h-10 rounded-full bg-[var(--pad-bg-hover)] flex items-center justify-center mb-2">
                    <i data-lucide="message-square-off" class="lucide text-[var(--pad-fg-tertiary)]"></i>
                  </div>
                  <div class="text-[13px] text-[var(--pad-fg-secondary)] tracking-widest">暂 未 使 用 上 下 文</div>
                  <div class="text-[12px] text-[var(--pad-fg-tertiary)] mt-1">追踪 TraeWork 工作时使用的工具和文件</div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </aside>
    </main>
  </div>

  <script>
    // 初始化 lucide 图标
    lucide.createIcons();

    // 侧栏收展
    const sidebar = document.getElementById('sidebar');
    const toggleSidebar = document.getElementById('toggleSidebar');
    toggleSidebar.addEventListener('click', () => {
      sidebar.classList.toggle('collapsed');
    });

    // 右侧抽屉收展
    const drawer = document.getElementById('drawer');
    const toggleDrawer = document.getElementById('toggleDrawer');
    const collapseDrawer = document.getElementById('collapseDrawer');
    function toggleDrawerState() {
      drawer.classList.toggle('collapsed');
    }
    toggleDrawer.addEventListener('click', toggleDrawerState);
    collapseDrawer.addEventListener('click', toggleDrawerState);

    // 工作区展开/折叠
    document.querySelectorAll('.workspace-toggle').forEach(btn => {
      btn.addEventListener('click', () => {
        const content = btn.nextElementSibling;
        const chevron = btn.querySelector('.workspace-chevron');
        if (content && content.classList.contains('workspace-content')) {
          content.style.display = content.style.display === 'none' ? 'block' : 'none';
          chevron.classList.toggle('collapsed');
        }
      });
    });

    // 思考过程展开/折叠
    document.querySelectorAll('.thinking-toggle').forEach(btn => {
      btn.addEventListener('click', () => {
        const body = btn.nextElementSibling;
        const chevron = btn.querySelector('.chevron');
        body.classList.toggle('collapsed');
        chevron.classList.toggle('collapsed');
      });
    });

    // Section 展开/折叠（待办、上下文）
    document.querySelectorAll('.section-toggle').forEach(btn => {
      btn.addEventListener('click', () => {
        const body = btn.nextElementSibling;
        const chevron = btn.querySelector('.chevron');
        body.style.display = body.style.display === 'none' ? 'block' : 'none';
        chevron.classList.toggle('collapsed');
      });
    });

    // "在 中打开" 下拉菜单
    const openInDropdown = document.getElementById('openInDropdown');
    const dropdownMenu = document.getElementById('dropdownMenu');
    openInDropdown.addEventListener('click', (e) => {
      e.stopPropagation();
      dropdownMenu.classList.toggle('hidden');
      openInDropdown.querySelector('.chevron').classList.toggle('collapsed');
    });
    document.addEventListener('click', () => {
      dropdownMenu.classList.add('hidden');
      openInDropdown.querySelector('.chevron').classList.add('collapsed');
    });
    dropdownMenu.addEventListener('click', (e) => e.stopPropagation());
  </script>
</body>
</html>
